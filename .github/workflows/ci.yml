name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t yaml-formatter:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name yf -p 5001:5001 yaml-formatter:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:5001/health && break; sleep 1; done
          curl -fsS -X POST http://localhost:5001/api/validate \
            -H 'Content-Type: application/json' \
            -d '{"content": "a: 1\n---\nb: 2", "filename": "ci.yaml"}' | grep -q '"valid":true'
          docker rm -f yf
