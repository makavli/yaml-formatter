<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAML Formatter - Validate & Format YAML Files</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.05em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .panel {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }

        .panel h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        /* File Input Section */
        .file-input-area {
            border: 3px dashed #667eea;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9ff;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .file-input-area:hover {
            background: #eff0ff;
            border-color: #764ba2;
        }

        .file-input-area.dragover {
            background: #eff0ff;
            border-color: #764ba2;
            transform: scale(1.02);
        }

        .file-input-area input {
            display: none;
        }

        .upload-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #333;
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .upload-hint {
            color: #999;
            font-size: 0.9em;
        }

        /* Textarea */
        .textarea-section {
            margin-top: 15px;
        }

        .textarea-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        /* Files List */
        .files-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 15px;
        }

        .file-item {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-item:hover {
            background: #f0f1f3;
            transform: translateX(5px);
        }

        .file-item.active {
            background: #e8ecff;
            border-left-color: #764ba2;
            font-weight: bold;
        }

        .file-item.valid {
            border-left-color: #4caf50;
        }

        .file-item.invalid {
            border-left-color: #f44336;
        }

        .file-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-item-name {
            font-size: 0.95em;
        }

        .file-item-status {
            font-size: 0.8em;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        .status-valid {
            background: #c8e6c9;
            color: #2e7d32;
        }

        .status-invalid {
            background: #ffcdd2;
            color: #c62828;
        }

        .file-item-details {
            font-size: 0.85em;
            color: #999;
            margin-top: 5px;
        }

        /* Output Section */
        .output-section {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .output-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-button {
            padding: 10px 15px;
            border: none;
            background: transparent;
            color: #999;
            cursor: pointer;
            font-size: 0.95em;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            margin-bottom: -2px;
        }

        .tab-button:hover {
            color: #667eea;
        }

        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .output-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .output-display {
            display: none;
            flex: 1;
        }

        .output-display.active {
            display: flex;
            flex-direction: column;
        }

        .output-textarea {
            width: 100%;
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            resize: none;
        }

        .output-textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        /* Error/Warning Display */
        .error-container {
            background: #ffebee;
            border: 2px solid #f44336;
            border-radius: 6px;
            padding: 15px;
            margin-top: 10px;
        }

        .error-title {
            color: #c62828;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .error-text {
            color: #d32f2f;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            word-break: break-word;
        }

        .warnings-container {
            background: #fff3e0;
            border: 2px solid #ff9800;
            border-radius: 6px;
            padding: 15px;
            margin-top: 10px;
        }

        .warning-title {
            color: #e65100;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .warning-item {
            color: #f57c00;
            font-size: 0.9em;
            margin-bottom: 8px;
            padding-left: 10px;
            border-left: 3px solid #ff9800;
        }

        .success-container {
            background: #e8f5e9;
            border: 2px solid #4caf50;
            border-radius: 6px;
            padding: 15px;
            margin-top: 10px;
            color: #2e7d32;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.3s;
            font-weight: 500;
        }

        .btn-primary {
            background: #667eea;
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            background: #764ba2;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .btn-download {
            background: #4caf50;
            color: white;
        }

        .btn-download:hover {
            background: #45a049;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }

        .empty-state p {
            font-size: 1.05em;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .copy-btn {
            background: #667eea;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
            margin-top: 10px;
        }

        .copy-btn:hover {
            background: #764ba2;
        }

        .copy-feedback {
            color: #4caf50;
            font-size: 0.85em;
            margin-top: 5px;
        }

        .no-files {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 YAML Formatter</h1>
            <p>Validate & Format YAML Files - Support for Azure DevOps, Kubernetes, and more</p>
        </header>

        <div class="main-content">
            <!-- Input Section -->
            <div class="panel">
                <h2>📥 Upload YAML Files</h2>
                
                <div class="file-input-area" id="dropZone">
                    <div class="upload-icon">📁</div>
                    <div class="upload-text">Drag & Drop YAML Files Here</div>
                    <div class="upload-hint">or click to select files</div>
                    <input type="file" id="fileInput" multiple accept=".yaml,.yml" />
                </div>

                <div class="textarea-section">
                    <div class="textarea-label">Or paste YAML content directly:</div>
                    <textarea id="pasteArea" placeholder="Paste your YAML content here..."></textarea>
                </div>

                <div class="button-group">
                    <button class="btn-primary" id="validateBtn">✓ Validate & Format</button>
                    <button class="btn-secondary" id="clearBtn">Clear All</button>
                </div>

                <h2 style="margin-top: 25px;">📂 Files</h2>
                <div class="files-list" id="filesList">
                    <div class="no-files">No files loaded yet</div>
                </div>
            </div>

            <!-- Output Section -->
            <div class="panel output-section">
                <h2>📤 Output</h2>

                <div class="output-tabs">
                    <button class="tab-button active" data-tab="formatted">Formatted YAML</button>
                    <button class="tab-button" data-tab="validation">Validation</button>
                </div>

                <div class="output-content">
                    <div class="output-display active" id="formattedTab">
                        <textarea class="output-textarea" id="outputYaml" readonly placeholder="Formatted YAML will appear here..."></textarea>
                        <button class="copy-btn" id="copyBtn" style="display: none;">📋 Copy to Clipboard</button>
                        <div id="copyFeedback" class="copy-feedback" style="display: none;"></div>
                    </div>

                    <div class="output-display" id="validationTab">
                        <div id="validationOutput" class="empty-state">
                            <p>Validation results will appear here...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api';
        let currentFile = null;
        let filesData = {};

        // DOM Elements
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const pasteArea = document.getElementById('pasteArea');
        const validateBtn = document.getElementById('validateBtn');
        const clearBtn = document.getElementById('clearBtn');
        const filesList = document.getElementById('filesList');
        const outputYaml = document.getElementById('outputYaml');
        const copyBtn = document.getElementById('copyBtn');
        const copyFeedback = document.getElementById('copyFeedback');
        const tabButtons = document.querySelectorAll('.tab-button');
        const outputDisplays = document.querySelectorAll('.output-display');

        // Drag and drop
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        // Tab switching
        tabButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                tabButtons.forEach(b => b.classList.remove('active'));
                outputDisplays.forEach(d => d.classList.remove('active'));
                
                e.target.classList.add('active');
                document.getElementById(e.target.dataset.tab + 'Tab').classList.add('active');
            });
        });

        // Buttons
        validateBtn.addEventListener('click', validateCurrentFile);
        clearBtn.addEventListener('click', clearAll);
        copyBtn.addEventListener('click', copyToClipboard);

        // Paste validation
        pasteArea.addEventListener('input', () => {
            if (pasteArea.value.trim()) {
                currentFile = '__pasted__';
                updateFilesList();
            }
        });

        function handleFiles(files) {
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const filename = file.name;
                    filesData[filename] = {
                        content: e.target.result,
                        status: 'pending'
                    };
                    updateFilesList();
                };
                reader.readAsText(file);
            });
        }

        function updateFilesList() {
            if (Object.keys(filesData).length === 0 && !pasteArea.value.trim()) {
                filesList.innerHTML = '<div class="no-files">No files loaded yet</div>';
                return;
            }

            filesList.innerHTML = '';

            // Add pasted content
            if (pasteArea.value.trim()) {
                const item = document.createElement('div');
                item.className = `file-item ${currentFile === '__pasted__' ? 'active' : ''}`;
                item.dataset.file = '__pasted__';
                item.innerHTML = `
                    <div class="file-item-header">
                        <div class="file-item-name">📝 Pasted Content</div>
                        <div class="file-item-status">Pending</div>
                    </div>
                `;
                item.addEventListener('click', () => selectFile('__pasted__'));
                filesList.appendChild(item);
            }

            // Add loaded files
            Object.keys(filesData).forEach(filename => {
                const item = document.createElement('div');
                const data = filesData[filename];
                item.className = `file-item ${data.status === 'valid' ? 'valid' : ''} ${data.status === 'invalid' ? 'invalid' : ''} ${currentFile === filename ? 'active' : ''}`;
                item.dataset.file = filename;
                
                let statusClass = 'status-invalid';
                let statusText = 'Invalid';
                if (data.status === 'valid') {
                    statusClass = 'status-valid';
                    statusText = 'Valid';
                } else if (data.status === 'pending') {
                    statusClass = '';
                    statusText = 'Pending';
                }

                item.innerHTML = `
                    <div class="file-item-header">
                        <div class="file-item-name">${escapeHtml(filename)}</div>
                        <div class="file-item-status ${statusClass}">${statusText}</div>
                    </div>
                    ${data.lines ? `<div class="file-item-details">${data.lines} lines</div>` : ''}
                `;
                
                item.addEventListener('click', () => selectFile(filename));
                filesList.appendChild(item);
            });
        }

        function selectFile(filename) {
            currentFile = filename;
            updateFilesList();
            displayFile(filename);
        }

        async function validateCurrentFile() {
            if (!currentFile) {
                alert('No file selected');
                return;
            }

            let content;
            if (currentFile === '__pasted__') {
                content = pasteArea.value;
            } else {
                content = filesData[currentFile].content;
            }

            try {
                const response = await fetch(`${API_URL}/validate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: content,
                        filename: currentFile
                    })
                });

                const result = await response.json();

                if (currentFile !== '__pasted__') {
                    filesData[currentFile].status = result.valid ? 'valid' : 'invalid';
                    filesData[currentFile].formatted = result.formatted;
                    filesData[currentFile].lines = result.lines;
                    filesData[currentFile].error = result.error;
                    filesData[currentFile].warnings = result.warnings;
                }

                updateFilesList();
                displayValidationResult(result);
                
                // Switch to formatted tab
                if (result.valid) {
                    document.querySelectorAll('.tab-button')[0].click();
                    outputYaml.value = result.formatted;
                    copyBtn.style.display = 'inline-block';
                }
            } catch (error) {
                alert('Error validating YAML: ' + error.message);
            }
        }

        function displayFile(filename) {
            const data = filesData[filename] || {};
            outputYaml.value = data.formatted || '';
            copyBtn.style.display = data.formatted ? 'inline-block' : 'none';
            
            if (data.error) {
                displayValidationResult(data);
            } else {
                document.getElementById('validationOutput').innerHTML = '<div class="empty-state"><p>Validate this file to see results</p></div>';
            }
        }

        function displayValidationResult(result) {
            const tab = document.getElementById('validationOutput');

            if (result.error) {
                tab.innerHTML = `
                    <div class="error-container">
                        <div class="error-title">❌ Validation Error</div>
                        <div class="error-text">${escapeHtml(result.error)}</div>
                    </div>
                `;
            } else {
                let html = '<div class="success-container">✅ YAML is valid and properly formatted!</div>';
                
                if (result.warnings && result.warnings.length > 0) {
                    html += '<div class="warnings-container"><div class="warning-title">⚠️ Warnings</div>';
                    result.warnings.forEach(w => {
                        html += `<div class="warning-item">${escapeHtml(w.message)}</div>`;
                    });
                    html += '</div>';
                }

                tab.innerHTML = html;
            }
        }

        function copyToClipboard() {
            outputYaml.select();
            document.execCommand('copy');
            copyFeedback.textContent = '✓ Copied to clipboard!';
            copyFeedback.style.display = 'block';
            setTimeout(() => {
                copyFeedback.style.display = 'none';
            }, 2000);
        }

        function clearAll() {
            filesData = {};
            pasteArea.value = '';
            outputYaml.value = '';
            currentFile = null;
            copyBtn.style.display = 'none';
            fileInput.value = '';
            updateFilesList();
            document.getElementById('validationOutput').innerHTML = '<div class="empty-state"><p>Validation results will appear here...</p></div>';
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Initialize
        updateFilesList();
    </script>
</body>
</html>
